name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAY_REVISION: e6cc36941ab2af5d81107617039d6f527a1c660b

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the supported Clay revision
        uses: actions/checkout@v4
        with:
          repository: nicbarker/clay
          ref: ${{ env.CLAY_REVISION }}
          path: _deps/clay

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Validate package metadata and Nim sources
        run: |
          nimble check
          nim check src/clayonnim.nim

      - name: Validate API coverage, ABI, and runtime integration
        run: tests/run_validation.sh _deps/clay
